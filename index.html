<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Civics.au — citizenship & public-good work</title>
<meta name="description" content="Civics.au is for citizenship and citizen-led public-good work — not a government (civic) agency portal. Owned and operated by Timothy Holborn as part of WebCivics."/>
<style>
  :root { color-scheme: light dark; --ink:#0f172a; --mute:#475569; --bg:#f8fafc; --accent:#0d9488; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e2e8f0; --mute:#94a3b8; --bg:#0b1220; --accent:#2dd4bf; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font: 16px/1.5 system-ui, sans-serif;
    color: var(--ink); background: var(--bg);
    display: grid; place-items: center; padding: 2rem;
  }
  main { max-width: 36rem; }
  h1 { font-size: 1.75rem; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
  p { margin: 0 0 1rem; color: var(--mute); }
  .note {
    font-size: 0.9rem; padding: 0.75rem 1rem; border-radius: 0.75rem;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }
  code { font-size: 0.85em; }
</style>
</head>
<body>
<main>
  <h1>Civics.au</h1>
  <p>Citizenship and citizen-led public-good work. Not a government service or civic-agency portal.</p>
  <p class="note">Scaffold for GitHub Pages — visual SoT landing from monet next. Databox · Walkabout · grounds · knowledge banks.</p>
  <p><small>Owned and operated by Timothy Holborn · WebCivics</small></p>
</main>
</body>
</html>
